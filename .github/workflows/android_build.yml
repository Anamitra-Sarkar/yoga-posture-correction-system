name: Build Android Debug APK

# Builds the Capacitor-wrapped Android app on GitHub's runners (JDK + Android
# SDK preinstalled) instead of the local dev machine, which has no JDK/SDK and
# limited RAM for a Gradle build. Server-mode Capacitor config means this APK
# just points at the live Vercel production URL -- it doesn't need a fresh
# Next.js build baked in, so this workflow only needs to run when the native
# Android project itself changes (manifest, gradle config, Capacitor plugins),
# not on every ordinary frontend/backend commit.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/android/**'
      - 'frontend/capacitor.config.ts'
      - 'frontend/package.json'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: asanaai-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
