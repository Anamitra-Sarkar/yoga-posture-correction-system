<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AsanaAI MediaPipe Fixture Check</title>
  <style>body{font-family:system-ui,sans-serif;background:#f8f7f2;color:#1f2621;margin:24px;max-width:760px}h1{font-size:22px}.result{border:1px solid #d7d9d2;background:#fff;border-radius:12px;padding:12px;margin:10px 0}.pass{border-color:#5c6b4e}.fail{border-color:#b86145}.meta{color:#6b736d;font-size:13px;line-height:1.5}</style>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
</head>
<body>
  <h1>AsanaAI MediaPipe fixture check</h1>
  <p class="meta">This page uses the same pose model options as the hidden native landmark worker. It tests landmark availability only; the shared backend remains responsible for pose classification from the resulting angles.</p>
  <div id="results">Loading model and fixtures…</div>
  <script>
    const fixtures = [
      { expected: "Warrior II", path: "/warrior-ii.jpeg" },
      { expected: "Cobra", path: "/cobra.jpg" },
      { expected: "Cobra alt", path: "/cobra-alt.webp" },
      { expected: "Plank", path: "/plank.jpeg" },
      { expected: "Plank alt", path: "/plank-alt.jpeg" }
    ];
    const results = document.getElementById("results");
    const landmarkOnly = new URLSearchParams(location.search).has("landmarks");
    const pose = new Pose({ locateFile: (file) => "https://cdn.jsdelivr.net/npm/@mediapipe/pose/" + file });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, enableSegmentation: false, smoothSegmentation: false, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
    let pendingResolve;
    pose.onResults((value) => pendingResolve?.(value.poseLandmarks || []));
    function loadImage(src) { return new Promise((resolve, reject) => { const image = new Image(); image.onload = () => resolve(image); image.onerror = () => reject(new Error("Unable to load fixture")); image.src = src; }); }
    function angle(a, b, c) { const ba = { x: a.x - b.x, y: a.y - b.y }; const bc = { x: c.x - b.x, y: c.y - b.y }; const dot = ba.x * bc.x + ba.y * bc.y; const first = Math.hypot(ba.x, ba.y); const second = Math.hypot(bc.x, bc.y); return !first || !second ? 0 : Math.acos(Math.max(-1, Math.min(1, dot / (first * second)))) * 180 / Math.PI; }
    function extractAngles(landmarks) { const points = landmarks.map(({ x, y }) => ({ x, y })); const shoulderMid = { x: (points[11].x + points[12].x) / 2, y: (points[11].y + points[12].y) / 2 }; const hipMid = { x: (points[23].x + points[24].x) / 2, y: (points[23].y + points[24].y) / 2 }; return [angle(points[11], points[13], points[15]), angle(points[12], points[14], points[16]), angle(points[23], points[11], points[13]), angle(points[24], points[12], points[14]), angle(points[11], points[23], points[25]), angle(points[12], points[24], points[26]), angle(points[23], points[25], points[27]), angle(points[24], points[26], points[28]), angle(points[25], points[27], points[29]), angle(points[26], points[28], points[30]), angle(points[11], points[23], points[24]), angle(points[12], points[24], points[23]), angle(points[0], shoulderMid, hipMid), angle(points[24], points[23], points[25]), angle(points[23], points[24], points[26])]; }
    async function post(path, payload) { const response = await fetch(`https://arko007-yoga-pose.hf.space/api${path}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }); if (!response.ok) throw new Error(`Service returned ${response.status}`); return response.json(); }
    async function run() {
      const output = [];
      for (const fixture of fixtures) {
        try {
          const image = await loadImage(fixture.path);
          const landmarks = await new Promise(async (resolve, reject) => { pendingResolve = resolve; try { await pose.send({ image }); } catch (error) { reject(error); } });
          const visible = landmarks.filter((point) => (point.visibility || 0) >= 0.6).length;
          if (landmarks.length !== 33) { output.push({ ...fixture, landmarks: landmarks.length, visible, status: "fail" }); continue; }
          if (landmarkOnly) { output.push({ ...fixture, landmarks: landmarks.length, visible, status: "pass", coordinates: landmarks.map((point) => [point.x, point.y, point.z, point.visibility || 0]) }); continue; }
          const recovery = await post("/occlusion_recovery", { mp_landmarks: landmarks.map((point) => [point.x, point.y, point.z, point.visibility || 0]) });
          const fused = recovery.fused_landmarks.map(([x, y, z, visibility]) => ({ x, y, z, visibility }));
          const analysis = await post("/analyse_frame", { angles: extractAngles(fused) });
          output.push({ ...fixture, landmarks: landmarks.length, visible, status: "pass", detected: analysis.pose_id, score: analysis.correctness_score, recovered: recovery.occluded_joints_recovered.length });
        } catch (error) { output.push({ ...fixture, landmarks: 0, visible: 0, status: "fail", error: String(error) }); }
      }
      results.innerHTML = output.map((entry) => `<div class="result ${entry.status}"><strong>${entry.expected}</strong><br><span class="meta">${entry.status === "pass" ? landmarkOnly ? `${entry.landmarks}/33 landmarks; ${entry.visible} at ≥0.60 visibility; landmark fixture captured.` : `${entry.landmarks}/33 landmarks; ${entry.visible} at ≥0.60 visibility; backend: ${entry.detected} (${Math.round(entry.score * 100)}%); ${entry.recovered} joints recovered.` : entry.error || "No complete landmark set returned."}</span></div>`).join("");
      window.fixtureResults = output;
      document.body.dataset.fixtureResults = JSON.stringify(output);
      if (landmarkOnly) await fetch("/results", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(output) });
    }
    run();
  </script>
</body>
</html>
